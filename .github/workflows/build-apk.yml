name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # One APK per CPU architecture instead of a single universal one — a
      # phone only ever needs its own, and this alone roughly halves the
      # download most users see (arm64-v8a covers virtually every phone
      # from the last several years).
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: land-installment-tracker-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
